    <style>
      #boot-splash { position: fixed; z-index: 9999; inset: 0; display: grid; place-items: center; overflow: hidden; background: #241b17 url('/assets/social/verse-card-background.jpg') center / cover no-repeat; color: #fffaf6; opacity: 1; transition: opacity 700ms ease, visibility 700ms ease; }
      #boot-splash::before { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(30 23 20 / 12%), rgb(30 23 20 / 52%)); content: ''; }
      #boot-splash.boot-splash--hidden { visibility: hidden; opacity: 0; pointer-events: none; }
      .boot-splash__content { position: relative; z-index: 1; display: grid; place-items: center; gap: 1rem; padding: 1.5rem; animation: boot-splash-breathe 4.6s ease-in-out infinite; }
      .boot-splash__mark { width: min(38vw, 11rem); height: min(38vw, 11rem); overflow: hidden; border: 1px solid rgb(255 255 255 / 82%); border-radius: 2.2rem; box-shadow: 0 1.5rem 3.5rem rgb(73 52 39 / 24%), 0 0 0 0.5rem rgb(255 255 255 / 38%); }
      .boot-splash__mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .boot-splash__brand { color: #fffaf6; font: 600 0.78rem/1.2 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.18em; text-shadow: 0 0.1rem 0.8rem rgb(30 23 20 / 45%); text-transform: uppercase; }
      @keyframes boot-splash-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-0.18rem) scale(1.012); } }
      @media (prefers-color-scheme: dark) { #boot-splash { background-color: #191519; color: #f4ece6; } #boot-splash::before { background: linear-gradient(180deg, rgb(12 9 8 / 24%), rgb(12 9 8 / 62%)); } .boot-splash__mark { border-color: rgb(255 255 255 / 18%); box-shadow: 0 1.5rem 3.5rem rgb(0 0 0 / 38%), 0 0 0 0.5rem rgb(255 255 255 / 6%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash { transition-duration: 1ms; } .boot-splash__content { animation: none; } }
    </style>
